{% extends 'base.html' %}
{% block title %}Password Reset Complete | Stainy Henna{% endblock %}

{% block content %}
<section class="relative py-24 min-h-screen flex items-center justify-center bg-cover bg-center bg-no-repeat" style="background-image: url('https://images.unsplash.com/photo-1596400619079-0db35c345b1e?q=80&w=2070&auto=format&fit=crop');">
    <div class="absolute inset-0 bg-maroon-900/40 mix-blend-multiply"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-maroon-900/90 via-transparent to-transparent"></div>

    <div class="relative z-10 w-full max-w-md px-4" data-aos="fade-up">
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-8 md:p-12 shadow-[0_8px_32px_0_rgba(31,38,135,0.37)] text-center">
            
            <div class="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-green-500/50 backdrop-blur-sm">
                <i class="fas fa-check text-4xl text-green-300"></i>
            </div>
            
            <h1 class="font-heading text-3xl font-bold text-white mb-4">Password Updated!</h1>
            <p class="text-white/80 text-sm leading-relaxed mb-8">
                Your password has been successfully reset. You may now log in with your new password.
            </p>

            <a href="{% url 'accounts:login' %}" class="inline-block w-full py-4 bg-gradient-to-r from-gold-400 to-gold-600 text-maroon-900 font-bold rounded-xl shadow-[0_4px_15px_rgba(200,169,81,0.4)] hover:shadow-[0_8px_25px_rgba(200,169,81,0.6)] transform hover:-translate-y-1 transition-all duration-300">
                Log In Now <i class="fas fa-sign-in-alt ml-2"></i>
            </a>
        </div>
    </div>
</section>
{% endblock %}
